services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID}
        NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET}
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${HOST_PORT:-3108}:3000"
